name: Build and test

on:
  push:
    branches: [main, v17/main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build backoffice
        working-directory: src/Umbraco.Community.LogLevels/Client
        run: npm ci && npm test && npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build Umbraco.Community.LogLevels.slnx --configuration Release
      - name: Test
        run: dotnet test Umbraco.Community.LogLevels.slnx --configuration Release --no-build --no-restore
      - name: Pack
        run: dotnet pack src/Umbraco.Community.LogLevels/Umbraco.Community.LogLevels.csproj --configuration Release --no-restore --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: loglevels-${{ matrix.os }}
          path: artifacts/*.nupkg
